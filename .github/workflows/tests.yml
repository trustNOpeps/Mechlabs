name: Tests
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: MECH.OS static-shaft numerical tests
        working-directory: experiments/mech-os
        run: node --test tests/engine.test.cjs
      - name: MECH.OS standalone build
        working-directory: experiments/mech-os
        run: |
          node scripts/build.cjs
          test -s MECH-OS-standalone.html
