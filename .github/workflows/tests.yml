name: Tests
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: MECH.OS static-shaft numerical tests
        working-directory: experiments/mech-os
        run: node --test tests/engine.test.cjs
      - name: MECH.OS standalone build
        working-directory: experiments/mech-os
        run: |
          node scripts/build.cjs
          test -s MECH-OS-standalone.html

      - name: Install Chromium Playwright test runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if command -v google-chrome >/dev/null 2>&1; then\n            echo "MECHOS_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"\n          elif command -v chromium >/dev/null 2>&1; then\n            echo "MECHOS_CHROMIUM=$(command -v chromium)" >> "$GITHUB_ENV"\n          else\n            python -m playwright install chromium\n          fi
      - name: MECH.OS mobile and hosted browser tests
        working-directory: experiments/mech-os
        run: python -m unittest discover -s tests -p 'test_browser.py' -v
